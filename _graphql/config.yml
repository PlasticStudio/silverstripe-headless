execute:
  - SilverStripe\Headless\GraphQL\ModelLoader
  - SilverStripe\Headless\GraphQL\OperationLoader
modelConfig:
  DataObject:
    type_formatter: 'SilverStripe\Core\ClassInfo::shortName'
    base_fields:
      ID: ID!
      HashID: String!
      # TypeAncestry: '[String]' Removed invalid injection type. Was forcing graphql to infer a nested type globally, which was breaking Elemental bulk loading & DataObjectModel creation
      exists: Boolean!
    plugins:
      versioning: false
      inheritance:
        useUnionQueries: false
    operations:
      read:
        plugins:
          filter: true
          # getByLink:
          #   after: filter
          #   before: paginateList
      readOne:
        plugins: []
          # getByLink:
          #   after: filter
